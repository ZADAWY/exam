<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>امتحان | سنتر الفارس ⚔️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Marhey:wght@400;500;600;700&display=swap"
rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    font-family:"Cairo",sans-serif;

    color:#fff;

    background:
        linear-gradient(
            rgba(3,5,10,.86),
            rgba(3,5,10,.94)
        ),
        url("background.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    overflow-x:hidden;
}

/* خلفية متحركة */

body::before{

    content:"";

    position:fixed;

    inset:-50%;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(0,255,170,.08),
            transparent 28%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(0,140,255,.08),
            transparent 30%
        );

    animation:bgMove 12s ease-in-out infinite alternate;

    pointer-events:none;

    z-index:-1;
}

@keyframes bgMove{

    from{
        transform:translate3d(-2%, -2%, 0) scale(1);
    }

    to{
        transform:translate3d(2%, 2%, 0) scale(1.06);
    }
}

/* الحاوية */

.container{

    width:min(950px,94%);

    margin:auto;

    padding:30px 0 60px;
}

/* الهيدر */

.header{

    text-align:center;

    margin-bottom:25px;

    animation:fadeDown .7s ease;
}

.header .icon{

    width:82px;
    height:82px;

    margin:0 auto 14px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;

    background:rgba(10,15,25,.72);

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 0 25px rgba(0,255,170,.16),
        inset 0 0 25px rgba(255,255,255,.04);

    animation:pulse 2.8s infinite;
}

.header h1{

    font-family:"Marhey",sans-serif;

    font-size:clamp(27px,6vw,43px);

    font-weight:700;

    text-shadow:
        0 0 20px rgba(0,255,170,.25);
}

.header p{

    margin-top:7px;

    color:#aeb8c8;

    font-size:14px;
}

/* الكروت */

.card{

    background:
        linear-gradient(
            145deg,
            rgba(12,18,29,.88),
            rgba(5,9,16,.91)
        );

    border:1px solid rgba(255,255,255,.09);

    border-radius:22px;

    padding:24px;

    margin-bottom:18px;

    box-shadow:
        0 18px 55px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.03);

    backdrop-filter:blur(12px);

    animation:fadeUp .65s ease;
}

/* الدخول */

#loginSection{

    max-width:600px;

    margin:40px auto 0;
}

.login-title{

    text-align:center;

    margin-bottom:22px;
}

.login-title h2{

    font-size:24px;

    margin-bottom:7px;
}

.login-title p{

    color:#aeb8c8;

    font-size:14px;
}

input{

    width:100%;

    height:55px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,.1);

    outline:none;

    background:rgba(0,0,0,.3);

    color:#fff;

    padding:0 17px;

    font-family:"Cairo",sans-serif;

    font-size:16px;

    transition:.25s;
}

input:focus{

    border-color:rgba(0,255,170,.55);

    box-shadow:
        0 0 0 3px rgba(0,255,170,.08),
        0 0 20px rgba(0,255,170,.08);
}

button{

    border:0;

    cursor:pointer;

    font-family:"Cairo",sans-serif;

    transition:.25s;
}

.primary-btn{

    width:100%;

    height:54px;

    margin-top:14px;

    border-radius:15px;

    color:#00130d;

    background:linear-gradient(
        135deg,
        #35e58c,
        #19c978
    );

    font-weight:900;

    font-size:16px;

    box-shadow:
        0 8px 25px rgba(53,229,140,.15);
}

.primary-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 12px 32px rgba(53,229,140,.25);
}

.primary-btn:active{

    transform:scale(.98);
}

/* حالة التحميل */

.loading{

    text-align:center;

    padding:35px 15px;

    color:#aeb8c8;
}

.spinner{

    width:45px;
    height:45px;

    margin:0 auto 15px;

    border-radius:50%;

    border:4px solid rgba(255,255,255,.08);

    border-top-color:#35e58c;

    animation:spin .8s linear infinite;
}

/* بيانات الامتحان */

.exam-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    flex-wrap:wrap;
}

.exam-info h2{

    font-size:clamp(22px,5vw,32px);

    margin-bottom:6px;
}

.exam-info p{

    color:#aeb8c8;

    line-height:1.8;

    font-size:14px;
}

.student-badge{

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:8px 13px;

    border-radius:12px;

    background:rgba(53,229,140,.08);

    border:1px solid rgba(53,229,140,.18);

    color:#35e58c;

    font-weight:800;

    margin-top:12px;
}

/* المؤقت */

.timer-box{

    position:sticky;

    top:12px;

    z-index:50;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    width:max-content;

    min-width:170px;

    margin:0 auto 18px;

    padding:12px 22px;

    border-radius:16px;

    background:rgba(8,12,20,.92);

    border:1px solid rgba(255,255,255,.1);

    box-shadow:0 10px 30px rgba(0,0,0,.35);

    backdrop-filter:blur(15px);
}

.timer-label{

    color:#aeb8c8;

    font-size:13px;
}

#timer{

    font-size:25px;

    font-weight:900;

    direction:ltr;

    letter-spacing:2px;

    color:#35e58c;

    min-width:75px;

    text-align:center;
}

.timer-danger{

    border-color:rgba(255,82,102,.5);

    box-shadow:
        0 0 25px rgba(255,82,102,.12);
}

.timer-danger #timer{

    color:#ff5267;

    animation:timerPulse .8s infinite;
}

/* الأسئلة */

.question-card{

    padding:22px;

    margin-bottom:15px;

    border-radius:19px;

    background:rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.075);

    transition:.25s;
}

.question-card:hover{

    border-color:rgba(53,229,140,.18);

    background:rgba(53,229,140,.025);
}

.question-number{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    min-width:40px;

    height:30px;

    padding:0 10px;

    border-radius:9px;

    background:rgba(53,229,140,.1);

    color:#35e58c;

    font-size:13px;

    font-weight:900;

    margin-bottom:13px;
}

.question-text{

    font-size:18px;

    font-weight:800;

    line-height:1.9;

    margin-bottom:18px;
}

/* الاختيارات */

.options{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:11px;
}

.option{

    position:relative;
}

.option input{

    position:absolute;

    opacity:0;

    pointer-events:none;
}

.option label{

    min-height:58px;

    display:flex;

    align-items:center;

    gap:12px;

    padding:12px 15px;

    border-radius:14px;

    background:rgba(0,0,0,.22);

    border:1px solid rgba(255,255,255,.09);

    cursor:pointer;

    transition:.25s;

    color:#dbe2ec;

}

.option label:hover{

    border-color:rgba(53,229,140,.3);

    transform:translateY(-1px);
}

.option-letter{

    width:32px;
    height:32px;

    flex:0 0 32px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:rgba(255,255,255,.06);

    font-weight:900;
}

.option input:checked + label{

    border-color:#35e58c;

    background:rgba(53,229,140,.1);

    color:#fff;

    box-shadow:
        0 0 20px rgba(53,229,140,.07);
}

.option input:checked + label .option-letter{

    background:#35e58c;

    color:#00130d;
}

/* زر التسليم */

.submit-area{

    position:sticky;

    bottom:12px;

    z-index:40;

    padding:15px;

    border-radius:18px;

    background:rgba(5,9,16,.88);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(14px);

    box-shadow:0 15px 45px rgba(0,0,0,.4);
}

.submit-btn{

    width:100%;

    min-height:56px;

    border-radius:15px;

    background:linear-gradient(
        135deg,
        #35e58c,
        #19c978
    );

    color:#00130d;

    font-size:17px;

    font-weight:900;
}

.submit-btn:hover{

    transform:translateY(-2px);
}

/* النتيجة */

#resultSection{

    display:none;

    max-width:650px;

    margin:40px auto;
}

.result-card{

    text-align:center;

    overflow:hidden;
}

.result-icon{

    width:90px;
    height:90px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin:0 auto 17px;

    border-radius:50%;

    font-size:45px;

    background:rgba(53,229,140,.09);

    border:1px solid rgba(53,229,140,.25);

    animation:resultPop .7s ease;
}

.result-card h2{

    font-size:28px;

    margin-bottom:8px;
}

.result-card p{

    color:#aeb8c8;

    line-height:1.9;
}

.score{

    margin:25px auto;

    width:190px;
    height:190px;

    border-radius:50%;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(53,229,140,.1),
            rgba(53,229,140,.02) 65%,
            transparent 66%
        );

    border:2px solid rgba(53,229,140,.35);

    box-shadow:
        0 0 40px rgba(53,229,140,.1);
}

#scoreNumber{

    font-size:45px;

    font-weight:900;

    color:#35e58c;
}

#scoreText{

    color:#aeb8c8;

    font-size:13px;
}

.result-details{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:10px;

    margin-top:20px;
}

.detail{

    padding:15px 10px;

    border-radius:14px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.07);
}

.detail strong{

    display:block;

    font-size:21px;

    margin-bottom:4px;
}

.detail span{

    color:#8f9aaa;

    font-size:12px;
}

/* الأخطاء */

.error-box{

    padding:15px;

    border-radius:13px;

    background:rgba(255,70,90,.08);

    border:1px solid rgba(255,70,90,.2);

    color:#ff8795;

    line-height:1.8;

    margin-top:15px;

    display:none;
}

/* مخفي */

.hidden{
    display:none !important;
}

/* Animations */

@keyframes fadeDown{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes pulse{

    0%,100%{
        box-shadow:
            0 0 25px rgba(0,255,170,.12),
            inset 0 0 25px rgba(255,255,255,.04);
    }

    50%{
        box-shadow:
            0 0 38px rgba(0,255,170,.23),
            inset 0 0 25px rgba(255,255,255,.06);
    }
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}

@keyframes timerPulse{

    50%{
        transform:scale(1.08);
    }
}

@keyframes resultPop{

    0%{
        opacity:0;
        transform:scale(.5);
    }

    70%{
        transform:scale(1.08);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

/* موبايل */

@media(max-width:650px){

    .container{
        width:94%;
        padding-top:20px;
    }

    .card{
        padding:17px;
        border-radius:18px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .question-text{
        font-size:16px;
    }

    .exam-top{
        display:block;
    }

    .timer-box{
        width:100%;
    }

    .result-details{
        grid-template-columns:1fr;
    }

    .header .icon{
        width:70px;
        height:70px;
        font-size:35px;
    }

}

/* منع تحديد النص أثناء الامتحان */

.exam-area{
    user-select:none;
}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header class="header">

        <div class="icon">
            ⚔️
        </div>

        <h1>
            سنتر الفارس
        </h1>

        <p>
            منصة الامتحانات الإلكترونية
        </p>

    </header>


    <!-- LOGIN -->

    <section id="loginSection" class="card">

        <div class="login-title">

            <h2>
                🎓 دخول الطالب
            </h2>

            <p>
                اكتب رمز الامتحان للدخول إلى الامتحان
            </p>

        </div>

        <input
            id="examCodeInput"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="رمز الامتحان"
        >

        <div id="loginError" class="error-box"></div>

        <button
            id="startBtn"
            class="primary-btn"
            type="button"
        >
            دخول وبدء الامتحان 🚀
        </button>

    </section>


    <!-- LOADING -->

    <section
        id="loadingSection"
        class="card hidden"
    >

        <div class="loading">

            <div class="spinner"></div>

            <div id="loadingText">
                جاري تحميل الامتحان...
            </div>

        </div>

    </section>


    <!-- EXAM -->

    <section
        id="examSection"
        class="hidden exam-area"
    >

        <div class="card">

            <div class="exam-top">

                <div class="exam-info">

                    <h2 id="examTitle">
                        الامتحان
                    </h2>

                    <p id="examDescription">
                    </p>

                    <div
                        id="studentBadge"
                        class="student-badge"
                    >
                        👤 الطالب
                    </div>

                </div>

            </div>

        </div>


        <!-- TIMER -->

        <div
            id="timerBox"
            class="timer-box"
        >

            <span class="timer-label">
                الوقت المتبقي
            </span>

            <span id="timer">
                00:00
            </span>

        </div>


        <!-- QUESTIONS -->

        <div
            id="questionsContainer"
        >
        </div>


        <!-- SUBMIT -->

        <div class="submit-area">

            <button
                id="submitBtn"
                class="submit-btn"
                type="button"
            >
                تسليم الامتحان ✅
            </button>

        </div>

    </section>


    <!-- RESULT -->

    <section
        id="resultSection"
    >

        <div class="card result-card">

            <div class="result-icon">
                🏆
            </div>

            <h2>
                تم تسليم الامتحان بنجاح
            </h2>

            <p id="resultMessage">
                تم حفظ نتيجتك بنجاح.
            </p>

            <div class="score">

                <span id="scoreNumber">
                    0%
                </span>

                <span id="scoreText">
                    النتيجة
                </span>

            </div>

            <div class="result-details">

                <div class="detail">

                    <strong id="correctCount">
                        0
                    </strong>

                    <span>
                        إجابات صحيحة
                    </span>

                </div>

                <div class="detail">

                    <strong id="wrongCount">
                        0
                    </strong>

                    <span>
                        إجابات خاطئة
                    </span>

                </div>

                <div class="detail">

                    <strong id="totalCount">
                        0
                    </strong>

                    <span>
                        إجمالي الأسئلة
                    </span>

                </div>

            </div>

        </div>

    </section>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://wjypxifpkdnswsphlwsz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_xw6K9NxHjKBohNpVgyyrQQ_qYS1l3TN";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let currentStudent = null;

let examCode = "";

let currentExam = null;

let questions = [];

let timerInterval = null;

let remainingSeconds = 0;

let examSubmitted = false;


/* =========================================
   GET EXAM ID FROM URL
========================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const examId =
    urlParams.get("exam");


/* =========================================
   ELEMENTS
========================================= */

const loginSection =
    document.getElementById(
        "loginSection"
    );

const loadingSection =
    document.getElementById(
        "loadingSection"
    );

const examSection =
    document.getElementById(
        "examSection"
    );

const resultSection =
    document.getElementById(
        "resultSection"
    );

const loginError =
    document.getElementById(
        "loginError"
    );

const examCodeInput =
    document.getElementById(
        "studentNumber"
    );

const startBtn =
    document.getElementById(
        "startBtn"
    );

const submitBtn =
    document.getElementById(
        "submitBtn"
    );


/* =========================================
   SAFE HTML
========================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   SHOW ERROR
========================================= */

function showLoginError(message){

    loginError.textContent =
        message;

    loginError.style.display =
        "block";

}


/* =========================================
   HIDE ERROR
========================================= */

function hideLoginError(){

    loginError.style.display =
        "none";

}


/* =========================================
   LOADING
========================================= */

function showLoading(text){

    document.getElementById(
        "loadingText"
    ).textContent = text;

    loginSection.classList.add(
        "hidden"
    );

    loadingSection.classList.remove(
        "hidden"
    );

}


/* =========================================
   LOAD EXAM
========================================= */

async function loadExam(){

    if(!examId){

        loadingSection.classList.add(
            "hidden"
        );

        loginSection.classList.remove(
            "hidden"
        );

        showLoginError(
            "لينك الامتحان غير صحيح. لازم تدخل من لينك الامتحان الذي أرسله المستر."
        );

        startBtn.disabled = true;

        return;
    }

}


/* =========================================
   START EXAM
========================================= */

async function startExam(){

    hideLoginError();

    const studentNumber =
        examCodeInput.value.trim().toUpperCase();

    if(!studentNumber){

        showLoginError(
            "اكتب رمز الامتحان الأول."
        );

        return;
    }


    showLoading(
        "جاري التحقق من بيانات الطالب..."
    );


    try{

        /* الطالب */

        const {
            data:student,
            error:studentError
        } =
        await supabaseClient
            .from("students")
            .select("*")
            .eq(
                "exam_code",
                examCode
            )
            .maybeSingle();


        if(studentError){

            throw studentError;

        }


        if(!student){

            throw new Error(
                "رمز الامتحان غير صحيح أو غير موجود. تأكد من الرمز وحاول مرة أخرى."
            );

        }


        currentStudent =
            student;


        /* الامتحان */

        document.getElementById(
            "loadingText"
        ).textContent =
            "جاري تحميل بيانات الامتحان...";


        const {
            data:exam,
            error:examError
        } =
        await supabaseClient
            .from("exams")
            .select("*")
            .eq(
                "id",
                examId
            )
            .eq(
                "is_published",
                true
            )
            .maybeSingle();


        if(examError){

            throw examError;

        }


        if(!exam){

            throw new Error(
                "الامتحان غير موجود أو لم يتم نشره بعد."
            );

        }


        currentExam =
            exam;


        /* الأسئلة */

        document.getElementById(
            "loadingText"
        ).textContent =
            "جاري تحميل الأسئلة...";


        const {
            data:examQuestions,
            error:questionsError
        } =
        await supabaseClient
            .from("exam_questions")
            .select(
                "id,exam_id,question_text,option_a,option_b,option_c,option_d,correct_answer,question_order"
            )
            .eq(
                "exam_id",
                exam.id
            )
            .order(
                "question_order",
                {
                    ascending:true
                }
            );


        if(questionsError){

            throw questionsError;

        }


        if(
            !examQuestions ||
            examQuestions.length === 0
        ){

            throw new Error(
                "الامتحان لا يحتوي على أسئلة حتى الآن."
            );

        }


        questions =
            examQuestions;


        /* منع إعادة الامتحان */

        document.getElementById(
            "loadingText"
        ).textContent =
            "جاري التأكد من حالة الامتحان...";


        const {
            data:previousResult,
            error:previousError
        } =
        await supabaseClient
            .from("exam_results")
            .select("id,score,total_questions,percentage,submitted_at")
            .eq(
                "exam_id",
                exam.id
            )
            .eq(
                "student_id",
                student.id
            )
            .maybeSingle();


        if(previousError){

            throw previousError;

        }


        if(previousResult){

            loadingSection.classList.add(
                "hidden"
            );

            loginSection.classList.remove(
                "hidden"
            );

            showLoginError(
                "أنت قمت بأداء هذا الامتحان من قبل، ولا يمكن إعادة الامتحان."
            );

            return;

        }


        /* عرض الامتحان */

        document.getElementById(
            "examTitle"
        ).textContent =
            exam.title || "الامتحان";


        document.getElementById(
            "examDescription"
        ).textContent =
            exam.description ||
            "بالتوفيق يا بطل ❤️";


        document.getElementById(
            "studentBadge"
        ).textContent =
            "👤 " +
            (student.name || "الطالب") +
            " • رمز " +
            (student.exam_code || "—");


        renderQuestions();


        /* الوقت */

        const duration =
            Number(
                exam.duration_minutes
            ) || 30;


        remainingSeconds =
            duration * 60;


        startTimer();


        loadingSection.classList.add(
            "hidden"
        );

        examSection.classList.remove(
            "hidden"
        );


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });


    }catch(error){

        console.error(error);

        loadingSection.classList.add(
            "hidden"
        );

        loginSection.classList.remove(
            "hidden"
        );

        showLoginError(
            error.message ||
            "حصل خطأ أثناء تحميل الامتحان."
        );

    }

}


/* =========================================
   RENDER QUESTIONS
========================================= */

function renderQuestions(){

    const container =
        document.getElementById(
            "questionsContainer"
        );


    container.innerHTML =
        questions.map(
            (q,index) => {

                const options = [

                    {
                        key:"A",
                        value:q.option_a
                    },

                    {
                        key:"B",
                        value:q.option_b
                    },

                    {
                        key:"C",
                        value:q.option_c
                    },

                    {
                        key:"D",
                        value:q.option_d
                    }

                ];


                return `

                    <div
                        class="question-card"
                        data-question-id="${q.id}"
                    >

                        <div class="question-number">
                            السؤال ${index + 1}
                        </div>

                        <div class="question-text">
                            ${escapeHTML(q.question_text)}
                        </div>

                        <div class="options">

                            ${options.map(
                                option => `

                                    <div class="option">

                                        <input
                                            type="radio"
                                            id="q${q.id}_${option.key}"
                                            name="question_${q.id}"
                                            value="${option.key}"
                                        >

                                        <label
                                            for="q${q.id}_${option.key}"
                                        >

                                            <span class="option-letter">
                                                ${option.key}
                                            </span>

                                            <span>
                                                ${escapeHTML(option.value)}
                                            </span>

                                        </label>

                                    </div>

                                `
                            ).join("")}

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =========================================
   TIMER
========================================= */

function startTimer(){

    clearInterval(
        timerInterval
    );


    updateTimer();


    timerInterval =
        setInterval(
            () => {

                remainingSeconds--;

                updateTimer();


                if(
                    remainingSeconds <= 0
                ){

                    clearInterval(
                        timerInterval
                    );

                    autoSubmit();

                }

            },
            1000
        );

}


/* =========================================
   UPDATE TIMER
========================================= */

function updateTimer(){

    const timer =
        document.getElementById(
            "timer"
        );

    const timerBox =
        document.getElementById(
            "timerBox"
        );


    const minutes =
        Math.floor(
            remainingSeconds / 60
        );

    const seconds =
        remainingSeconds % 60;


    timer.textContent =
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");


    if(
        remainingSeconds <= 60
    ){

        timerBox.classList.add(
            "timer-danger"
        );

    }else{

        timerBox.classList.remove(
            "timer-danger"
        );

    }

}


/* =========================================
   AUTO SUBMIT
========================================= */

async function autoSubmit(){

    if(examSubmitted){
        return;
    }


    alert(
        "⏰ انتهى وقت الامتحان، سيتم تسليم إجاباتك تلقائيًا."
    );


    await submitExam(true);

}


/* =========================================
   GET ANSWERS
========================================= */

function collectAnswers(){

    return questions.map(
        question => {

            const selected =
                document.querySelector(
                    `input[name="question_${question.id}"]:checked`
                );


            return {

                questionId:
                    question.id,

                answer:
                    selected
                    ? selected.value
                    : null,

                correctAnswer:
                    String(
                        question.correct_answer || ""
                    ).trim().toUpperCase()

            };

        }
    );

}


/* =========================================
   SUBMIT EXAM
========================================= */

async function submitExam(auto = false){

    if(examSubmitted){

        return;

    }


    if(!auto){

        const confirmed =
            confirm(
                "هل أنت متأكد من تسليم الامتحان؟\n\nبعد التسليم لن تستطيع تعديل الإجابات."
            );


        if(!confirmed){

            return;

        }

    }


    examSubmitted = true;


    clearInterval(
        timerInterval
    );


    submitBtn.disabled = true;

    submitBtn.textContent =
        "جاري حفظ النتيجة...";


    try{

        const answers =
            collectAnswers();


        let score = 0;


        answers.forEach(
            item => {

                if(
                    item.answer &&
                    item.answer ===
                    item.correctAnswer
                ){

                    score++;

                }

            }
        );


        const totalQuestions =
            questions.length;


        const percentage =
            totalQuestions > 0
            ? Number(
                (
                    score /
                    totalQuestions
                ) * 100
            ).toFixed(2)
            : 0;


        /* حفظ النتيجة */

        const {
            data:result,
            error:resultError
        } =
        await supabaseClient
            .from("exam_results")
            .insert({

                exam_id:
                    currentExam.id,

                student_id:
                    currentStudent.id,

                score:
                    score,

                total_questions:
                    totalQuestions,

                percentage:
                    percentage

            })
            .select()
            .single();


        if(resultError){

            throw resultError;

        }


        /* حفظ إجابات الطالب */

        const answersToInsert =
            answers.map(
                item => ({

                    result_id:
                        result.id,

                    exam_id:
                        currentExam.id,

                    student_id:
                        currentStudent.id,

                    question_id:
                        item.questionId,

                    answer:
                        item.answer,

                    is_correct:
                        !!(
                            item.answer &&
                            item.answer ===
                            item.correctAnswer
                        )

                })
            );


        const {
            error:answersError
        } =
        await supabaseClient
            .from("student_answers")
            .insert(
                answersToInsert
            );


        if(answersError){

            /*
             النتيجة اتحفظت بالفعل.
             لكن لو الإجابات حصل فيها خطأ
             بنبلغ المستخدم.
            */

            console.error(
                answersError
            );

            throw new Error(
                "تم حفظ النتيجة، لكن حصل خطأ أثناء حفظ تفاصيل الإجابات: " +
                answersError.message
            );

        }


        showResult(
            score,
            totalQuestions,
            percentage
        );


    }catch(error){

        console.error(error);

        examSubmitted = false;

        submitBtn.disabled = false;

        submitBtn.textContent =
            "تسليم الامتحان ✅";


        alert(
            "حصل خطأ أثناء تسليم الامتحان:\n\n" +
            error.message
        );

    }

}


/* =========================================
   SHOW RESULT
========================================= */

function showResult(
    score,
    total,
    percentage
){

    examSection.classList.add(
        "hidden"
    );


    resultSection.style.display =
        "block";


    document.getElementById(
        "scoreNumber"
    ).textContent =
        percentage + "%";


    document.getElementById(
        "correctCount"
    ).textContent =
        score;


    document.getElementById(
        "wrongCount"
    ).textContent =
        total - score;


    document.getElementById(
        "totalCount"
    ).textContent =
        total;


    let message = "";


    if(percentage >= 90){

        message =
            "🔥 ممتاز جدًا! أداء أسطوري يا بطل.";

    }else if(percentage >= 75){

        message =
            "👏 ممتاز! نتيجة قوية جدًا.";

    }else if(percentage >= 50){

        message =
            "💪 كويس، ومع شوية تركيز هتكسرها المرة الجاية.";

    }else{

        message =
            "❤️ متزعلش، راجع إجاباتك وإن شاء الله الجاية أفضل.";

    }


    document.getElementById(
        "resultMessage"
    ).textContent =
        message;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================
   EVENTS
========================================= */

startBtn.addEventListener(
    "click",
    startExam
);


submitBtn.addEventListener(
    "click",
    () => submitExam(false)
);


examCodeInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            startExam();

        }

    }
);


/* =========================================
   INITIALIZE
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadExam();

    }
);

</script>
